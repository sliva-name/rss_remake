        identityConfidence: {type: string}
        events: {type: integer, format: int64}
        sensitiveEvents: {type: integer, format: int64}
        categories:
          type: array
          items: {type: string}
        sources: {type: integer, format: int64}
        lastAccess: {type: string, format: date-time}
    CategoryAccess:
      type: object
      required: [category, events, principals, sources, lastAccess]
      properties:
        category: {type: string}
        events: {type: integer, format: int64}
