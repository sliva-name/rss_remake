openapi: 3.0.3
info:
  title: DataGuard API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          description: Authenticated principal
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurrentUser"}
  /preferences/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: {$ref: "#/components/schemas/PreferenceKey"}
    get:
      operationId: getPreference
      description: A personal setting of the caller in the current organization. Value is null when it was never saved.
      responses:
        "200":
          description: The setting
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preference"}
    put:
      operationId: savePreference
      description: Replaces the setting. At most 64 KiB of JSON; references and filters only, never data values.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Preference"}
      responses:
        "204":
          description: Saved
  /tenants:
    get:
      operationId: listTenants
      responses:
        "200":
          description: All organizations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Tenant"}
    post:
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewTenant"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tenant"}
  /environments:
    get:
      operationId: listEnvironments
      responses:
        "200":
          description: Environments of the current tenant
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Environment"}
    post:
      operationId: createEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewEnvironment"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Environment"}
  /enrollment-tokens:
    post:
      operationId: createEnrollmentToken
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewEnrollmentToken"}
      responses:
        "201":
          description: The token is shown once and cannot be read again
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnrollmentToken"}
  /agents:
    get:
      operationId: listAgents
      responses:
        "200":
          description: Agents of the current tenant
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Agent"}
  /agents/{agentId}:
    get:
      operationId: getAgent
      parameters:
        - name: agentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The agent
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Agent"}
  /agents/{agentId}/revoke:
    post:
      operationId: revokeAgent
      parameters:
        - name: agentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: Revoked
  /sources:
    get:
      operationId: listSources
      responses:
        "200":
          description: Data sources of the current tenant
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Source"}
    post:
      operationId: createSource
      description: The password arrives sealed to the agent's sealingPublicKey; the server cannot open it.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewSource"}
      responses:
        "201":
          description: Created; the agent picks it up with its next heartbeat
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Source"}
  /sources/{sourceId}:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getSource
      responses:
        "200":
          description: The source; a deleted one is not found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Source"}
    put:
      operationId: updateSource
      description: The agent and the engine cannot change. A change of host, port, database, user or TLS needs the password sealed again.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SourceUpdate"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Source"}
    delete:
      operationId: deleteSource
      description: The agent stops serving the source; its inventory and access history stay.
      responses:
        "204":
          description: Deleted
  /sources/{sourceId}/activate:
    post:
      operationId: activateSource
      description: Saves a checked draft; the agent starts scanning it and reading its audit. A saved source is returned as is.
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The saved source
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Source"}
  /scans:
    get:
      operationId: listScans
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Recent scans
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Scan"}
    post:
      operationId: requestScan
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewScan"}
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Scan"}
  /catalog/columns:
    get:
      operationId: listCatalogColumns
      description: Active columns with detected classifications
      parameters:
        - {name: sourceId, in: query, schema: {type: string, format: uuid}}
        - {name: category, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: Sensitive columns
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogPage"}
  /catalog/columns/{columnId}:
    get:
      operationId: getCatalogColumn
      description: A column with every classification decision and its renames, also after it was removed
      parameters:
        - name: columnId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The column
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogColumnDetail"}
  /catalog/tables:
    get:
      operationId: listCatalogTables
      description: Active tables, by database, schema and name
      parameters:
        - {name: sourceId, in: query, schema: {type: string, format: uuid}}
        - name: q
          in: query
          description: Part of the database, schema or table name, case-insensitive.
          schema: {type: string, maxLength: 128}
        - name: category
          in: query
          description: Only tables with a column of this category.
          schema: {type: string}
        - name: sensitive
          in: query
          description: Only tables with at least one sensitive column.
          schema: {type: boolean, default: false}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: Tables
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogTablePage"}
  /catalog/tables/{tableId}:
    get:
      operationId: getCatalogTable
      description: A table with its active columns, also after it was removed
      parameters:
        - name: tableId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The table
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogTableDetail"}
  /catalog/summary:
    get:
      operationId: getCatalogSummary
      responses:
        "200":
          description: Number of active columns per category
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CategoryInventory"}
  /catalog/changes:
    get:
      operationId: listCatalogChanges
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Recent changes of the inventory
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CatalogChange"}
  /audit/events:
    get:
      operationId: listAuditEvents
      parameters:
        - {name: sourceId, in: query, schema: {type: string, format: uuid}}
        - name: tableId
          in: query
          description: Events that name the table or read any of its columns, also under names it had before a rename.
          schema: {type: string, format: uuid}
        - {name: columnId, in: query, schema: {type: string, format: uuid}}
        - {name: principal, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: eventType, in: query, schema: {type: string}}
        - name: sessionId
          in: query
          description: Events of one database session, as the engine numbered it.
          schema: {type: string, maxLength: 128}
        - name: includeLogins
          in: query
          description: Logins outnumber data access by far, so they are left out unless asked for or filtered by type.
          schema: {type: boolean, default: false}
        - name: includeScanner
          in: query
          description: Reads by the agent's own scanner login are left out unless asked for.
          schema: {type: boolean, default: false}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: Matching events, newest first
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditEventPage"}
  /audit/events/export:
    get:
      operationId: exportAuditEvents
      description: The same selection as listAuditEvents as CSV, newest first, at most 100 000 rows. X-Dataguard-Truncated is true when more matched.
      parameters:
        - {name: sourceId, in: query, schema: {type: string, format: uuid}}
        - {name: tableId, in: query, schema: {type: string, format: uuid}}
        - {name: columnId, in: query, schema: {type: string, format: uuid}}
        - {name: principal, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: eventType, in: query, schema: {type: string}}
        - {name: sessionId, in: query, schema: {type: string, maxLength: 128}}
        - {name: includeLogins, in: query, schema: {type: boolean, default: false}}
        - {name: includeScanner, in: query, schema: {type: boolean, default: false}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: CSV, UTF-8 with a byte order mark so spreadsheet programs read Cyrillic correctly
          headers:
            X-Dataguard-Truncated:
              schema: {type: boolean}
          content:
            text/csv:
              schema: {type: string, format: binary}
  /audit/coverage:
    get:
      operationId: getAuditCoverage
      parameters:
        - {name: windowHours, in: query, schema: {type: integer, minimum: 1, maximum: 720, default: 24}}
      responses:
        "200":
          description: What can and cannot be observed, per source
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CoverageRow"}
  /analytics/summary:
    get:
      operationId: getAccessSummary
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Headline numbers of a period
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccessSummary"}
  /analytics/principals:
    get:
      operationId: listAccessByPrincipal
      parameters:
        - name: category
          in: query
          description: Count only the events that touched this category.
          schema: {type: string}
        - name: columnId
          in: query
          description: Count only the events that read this column. Read from the events themselves, not the hourly aggregate.
          schema: {type: string, format: uuid}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Access grouped by who acted
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PrincipalAccess"}
  /analytics/categories:
    get:
      operationId: listAccessByCategory
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Access grouped by data category
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CategoryAccess"}
  /analytics/timeline:
    get:
      operationId: getAccessTimeline
      description: Events per hour. Hours without events are absent; coverage tells whether an hour was observed.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Hourly counts, oldest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/TimelinePoint"}
  /search:
    get:
      operationId: search
      description: Objects whose name contains the text. Each group is filled only when the caller may read that kind of object.
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 128}
      responses:
        "200":
          description: Matches, at most 8 per group
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchResult"}
  /policy:
    get:
      operationId: getPolicy
      responses:
        "200":
          description: Latest published policy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Policy"}
    put:
      operationId: publishPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PolicyDraft"}
      responses:
        "201":
          description: Published as a new version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Policy"}
  /policy/versions:
    get:
      operationId: listPolicyVersions
      responses:
        "200":
          description: Every published version, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PolicyVersion"}
  /policy/versions/{version}:
    get:
      operationId: getPolicyVersion
      parameters:
        - name: version
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: One published version as it was signed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Policy"}
  /operator-actions:
    get:
      operationId: listOperatorActions
      description: >-
        The journal of what operators did in the organization, newest first. It
        names fields and versions, never data values or passwords.
      parameters:
        - name: before
          in: query
          description: Continue after the entry with this id
          schema: {type: string, format: uuid}
        - name: objectId
          in: query
          description: Only actions on this object
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 50}
      responses:
        "200":
          description: Entries, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/OperatorAction"}
  /analytics/signals:
    get:
      operationId: listRiskSignals
      description: >-
        Heuristic signals over the last 24 hours compared with the days before.
        A signal is a reason to look, not a confirmed incident; each carries the
        rule and the numbers it was computed from.
      responses:
        "200":
          description: Signals, strongest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/RiskSignal"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    CurrentUser:
      type: object
      required: [subject, roles, permissions]
      properties:
        subject: {type: string}
        tenantId: {type: string, format: uuid}
        roles:
          type: array
          items: {type: string}
        permissions:
          description: Operations the caller may invoke, computed from the same rules that check each call. The dashboard decides what to show from these, never from roles (ADR-0010).
          type: array
          items: {$ref: "#/components/schemas/Permission"}
    PreferenceKey:
      type: string
      enum: [views, favorites, recent, overview]
    Preference:
      type: object
      required: [value]
      properties:
        value:
          description: Whatever the dashboard keeps under the key, as JSON; null when never saved.
          nullable: true
    PolicyVersion:
      type: object
      required: [version, createdBy, createdAt, customDetectors, hasScanBudget]
      properties:
        version: {type: integer, format: int64}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        customDetectors: {type: integer}
        hasScanBudget: {type: boolean}
    OperatorAction:
      type: object
      required: [id, at, actorSubject, actorName, action, objectKind, objectId, objectLabel, details]
      properties:
        id: {type: string, format: uuid}
        at: {type: string, format: date-time}
        actorSubject:
          description: Subject of the account at the identity provider; empty for the platform itself
          type: string
        actorName: {type: string}
        action:
          type: string
          enum: [tenant.create, environment.create, enrollment_token.issue, agent.enroll, agent.revoke,
                 source.create, source.update, source.delete, scan.request, policy.publish]
        objectKind:
          description: What objectId refers to
          type: string
          enum: [tenant, environment, agent, source]
        objectId:
          description: >-
            The object acted on. A token is issued for an environment, a scan is
            requested for a source and a policy belongs to the organization, so
            those carry the environment, the source and the organization.
          type: string
          format: uuid
        objectLabel:
          description: The object's name when it happened; empty when the object has none
          type: string
        details:
          description: >-
            Value-free facts: changes lists the settings an update touched,
            version is a published policy version, environment the environment
            of an enrolled agent, reason why the platform itself acted (restore:
            a policy from a restored backup published again above what agents had).
          type: object
          additionalProperties: {type: string}
    RiskSignal:
      type: object
      required: [kind, databasePrincipal, applicationPrincipal, identityConfidence, category, observed, baseline, lastSeen]
      properties:
        kind:
          type: string
          enum: [VOLUME_SPIKE, NEW_CATEGORY, FAILED_ACCESS]
        databasePrincipal: {type: string}
        applicationPrincipal: {type: string}
        identityConfidence: {type: string}
        category:
          description: Empty when the signal is not about one category.
          type: string
        observed:
          description: Events in the last 24 hours that the rule counted.
          type: integer
          format: int64
        baseline:
          description: What the rule compared with; its meaning depends on the kind.
          type: number
          format: double
        lastSeen: {type: string, format: date-time}
    PrincipalHit:
      type: object
      required: [databasePrincipal, applicationPrincipal, events]
      properties:
        databasePrincipal: {type: string}
        applicationPrincipal: {type: string}
        events:
          description: Events in the last 30 days.
          type: integer
          format: int64
    Permission:
      description: An operationId of this API.
      type: string
      enum:
        - getCurrentUser
        - getPreference
        - savePreference
        - exportAuditEvents
        - listPolicyVersions
        - getPolicyVersion
        - listRiskSignals
        - listOperatorActions
        - listTenants
        - createTenant
        - listEnvironments
        - createEnvironment
        - createEnrollmentToken
        - listAgents
        - getAgent
        - revokeAgent
        - listSources
        - getSource
        - createSource
        - updateSource
        - deleteSource
        - activateSource
        - listScans
        - requestScan
        - listCatalogColumns
        - getCatalogColumn
        - listCatalogTables
        - getCatalogTable
        - getCatalogSummary
        - listCatalogChanges
        - listAuditEvents
        - getAuditCoverage
        - getAccessSummary
        - getAccessTimeline
        - search
        - listAccessByPrincipal
        - listAccessByCategory
        - getPolicy
        - publishPolicy
    NewTenant:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
    Tenant:
      type: object
      required: [id, name, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        createdAt: {type: string, format: date-time}
    NewEnvironment:
      type: object
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {$ref: "#/components/schemas/EnvironmentKind"}
    EnvironmentKind:
      type: string
      enum: [development, testing, production]
    Environment:
      type: object
      required: [id, name, kind, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {$ref: "#/components/schemas/EnvironmentKind"}
        createdAt: {type: string, format: date-time}
    NewEnrollmentToken:
      type: object
      required: [environmentId]
      properties:
        environmentId: {type: string, format: uuid}
    EnrollmentToken:
      type: object
      required: [token, expiresAt]
      properties:
        token: {type: string}
        expiresAt: {type: string, format: date-time}
    Agent:
      type: object
      required: [id, environmentId, status, version, contractVersion, policyKeyEpoch, certificateExpires, createdAt]
      properties:
        id: {type: string, format: uuid}
        environmentId: {type: string, format: uuid}
        status: {type: string, enum: [active, revoked]}
        version: {type: string}
        contractVersion:
          description: Contract version of the last accepted heartbeat
          type: integer
          format: int32
        policyKeyEpoch:
          description: Epoch of the policy signing key the agent trusts; it takes a rotated key with its next heartbeat
          type: integer
          format: int32
        problemCode:
          description: Why the center does not accept the agent right now, such as CONTRACT_UNSUPPORTED. Absent when nothing is wrong.
          type: string
        certificateExpires: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        sealingPublicKey:
          description: Uncompressed P-256 point the browser seals passwords to. Absent for agents enrolled before managed sources.
          type: string
          format: byte
    Capability:
      type: object
      required: [capability, support, reasonCode]
      properties:
        capability: {type: string}
        support: {type: string}
        reasonCode: {type: string}
    SourceEngine:
      type: string
      enum: [postgresql, mysql, mariadb, mssql]
    TlsMode:
      type: string
      enum: [verify-full, require, disable]
    SourceUpdate:
      type: object
      required: [name, engine, host, port, database, username, tls]
      properties:
        name: {type: string, pattern: "^[a-z][a-z0-9_-]{0,63}$"}
        engine: {$ref: "#/components/schemas/SourceEngine"}
        host: {type: string, minLength: 1, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535}
        database: {type: string, minLength: 1, maxLength: 128}
        username: {type: string, minLength: 1, maxLength: 128}
        tls: {$ref: "#/components/schemas/TlsMode"}
        auditDirectory: {type: string, maxLength: 512}
        maxConnections: {type: integer, minimum: 1, maximum: 8}
        sealedPassword:
          description: Omit to keep the current password; required when the binding changes.
          type: string
          format: byte
    NewSource:
      allOf:
        - $ref: "#/components/schemas/SourceUpdate"
        - type: object
          required: [agentId, sealedPassword]
          properties:
            agentId: {type: string, format: uuid}
            draft:
              description: Check the connection before saving. The agent opens and probes a draft but neither scans it nor reads its audit; activateSource saves it. A draft older than an hour is removed when the next source is added to the same agent.
              type: boolean
              default: false
    Source:
      type: object
      required: [id, agentId, key, engine, host, port, database, username, tls, auditDirectory, maxConnections, statusCode, engineVersion, capabilities, updatedAt, draft]
      properties:
        id: {type: string, format: uuid}
        agentId: {type: string, format: uuid}
        key: {type: string}
        engine: {type: string}
        host: {type: string}
        port: {type: integer}
        database: {type: string}
        username: {type: string}
        tls: {$ref: "#/components/schemas/TlsMode"}
        auditDirectory: {type: string}
        maxConnections: {type: integer}
        statusCode:
          description: Empty when the agent opened the source; otherwise why it did not.
          type: string
        probedAt: {type: string, format: date-time}
        engineVersion: {type: string}
        capabilities:
          type: array
          items: {$ref: "#/components/schemas/Capability"}
        updatedAt: {type: string, format: date-time}
        draft:
          description: A connection check that has not been saved yet.
          type: boolean
    NewScan:
      type: object
      required: [sourceId]
      properties:
        sourceId: {type: string, format: uuid}
    Scan:
      type: object
      required: [id, sourceId, status, requestedBy, failureCode, createdAt]
      properties:
        id: {type: string, format: uuid}
        sourceId: {type: string, format: uuid}
        status: {type: string, enum: [pending, running, completed, partial, failed, cancelled]}
        requestedBy: {type: string}
        failureCode: {type: string}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
    CatalogColumn:
      type: object
      required: [columnId, tableId, sourceId, database, schema, table, column, nativeType, categoryId, confidence, nameMatch, contextMatch, formatRatio, rowsInspected, rowsNonNull, rowsMatched, uniqueEstimate, samplingMethod, updatedAt]
      properties:
        columnId: {type: string, format: uuid}
        tableId: {type: string, format: uuid}
        sourceId: {type: string, format: uuid}
        database: {type: string}
        schema: {type: string}
        table: {type: string}
        column: {type: string}
        nativeType: {type: string}
        categoryId: {type: string}
        confidence: {type: number, format: double}
        nameMatch: {type: boolean}
        contextMatch: {type: boolean}
        formatRatio: {type: number, format: double}
        checksumRatio: {type: number, format: double}
        rowsInspected: {type: integer, format: int64}
        rowsNonNull: {type: integer, format: int64}
        rowsMatched: {type: integer, format: int64}
        uniqueEstimate: {type: integer, format: int64}
        samplingMethod: {type: string}
        updatedAt: {type: string, format: date-time}
    CatalogPage:
      type: object
      required: [total, items]
      properties:
        total: {type: integer, format: int64}
        items:
          type: array
          items: {$ref: "#/components/schemas/CatalogColumn"}
    CatalogTable:
      type: object
      required: [id, sourceId, database, schema, table, kind, columns, sensitiveColumns, categories, lastSeenAt]
      properties:
        id: {type: string, format: uuid}
        sourceId: {type: string, format: uuid}
        database: {type: string}
        schema: {type: string}
        table: {type: string}
        kind: {type: string}
        columns: {type: integer, format: int64}
        sensitiveColumns: {type: integer, format: int64}
        categories:
          type: array
          items: {type: string}
        lastSeenAt: {type: string, format: date-time}
    CatalogTablePage:
      type: object
      required: [total, items]
      properties:
        total: {type: integer, format: int64}
        items:
          type: array
          items: {$ref: "#/components/schemas/CatalogTable"}
    ObjectStatus:
      type: string
      enum: [active, removed]
    TableColumn:
      type: object
      required: [id, name, nativeType, ordinal, nullable, categories]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        nativeType: {type: string}
        ordinal: {type: integer, format: int32}
        nullable: {type: boolean}
        categories:
          description: Detected categories only.
          type: array
          items: {type: string}
    CatalogTableDetail:
      type: object
      required: [id, sourceId, database, schema, table, kind, status, firstSeenAt, lastSeenAt, columns, renames]
      properties:
        id: {type: string, format: uuid}
        sourceId: {type: string, format: uuid}
        database: {type: string}
        schema: {type: string}
        table: {type: string}
        kind: {type: string}
        status: {$ref: "#/components/schemas/ObjectStatus"}
        firstSeenAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        columns:
          type: array
          items: {$ref: "#/components/schemas/TableColumn"}
        renames:
          type: array
          items: {$ref: "#/components/schemas/Rename"}
    Classification:
      type: object
      required: [categoryId, detected, confidence, nameMatch, contextMatch, formatRatio, rowsInspected, rowsNonNull, rowsMatched, uniqueEstimate, samplingMethod, firstSeenAt, updatedAt]
      properties:
        categoryId: {type: string}
        detected:
          description: False when the classifier looked and decided the category is absent.
          type: boolean
        confidence: {type: number, format: double}
        nameMatch: {type: boolean}
        contextMatch: {type: boolean}
        formatRatio: {type: number, format: double}
        checksumRatio: {type: number, format: double}
        rowsInspected: {type: integer, format: int64}
        rowsNonNull: {type: integer, format: int64}
        rowsMatched: {type: integer, format: int64}
        uniqueEstimate: {type: integer, format: int64}
        samplingMethod: {type: string}
        firstSeenAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Rename:
      type: object
      required: [oldName, newName, detectedAt, detectedBy]
      properties:
        oldName: {type: string}
        newName: {type: string}
        detectedAt: {type: string, format: date-time}
        detectedBy: {type: string}
    CatalogColumnDetail:
      type: object
      required: [id, tableId, sourceId, database, schema, table, name, nativeType, ordinal, nullable, status, firstSeenAt, lastSeenAt, classifications, renames]
      properties:
        id: {type: string, format: uuid}
        tableId: {type: string, format: uuid}
        sourceId: {type: string, format: uuid}
        database: {type: string}
        schema: {type: string}
        table: {type: string}
        name: {type: string}
        nativeType: {type: string}
        ordinal: {type: integer, format: int32}
        nullable: {type: boolean}
        status: {$ref: "#/components/schemas/ObjectStatus"}
        firstSeenAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        classifications:
          type: array
          items: {$ref: "#/components/schemas/Classification"}
        renames:
          type: array
          items: {$ref: "#/components/schemas/Rename"}
    CatalogChange:
      type: object
      required: [occurredAt, kind, tableId, categoryId, tableName, sourceKey]
      properties:
        occurredAt: {type: string, format: date-time}
        kind: {type: string}
        tableId: {type: string, format: uuid}
        sourceKey: {type: string}
        tableName: {type: string}
        columnId: {type: string, format: uuid}
        columnName: {type: string}
        categoryId: {type: string}
    CustomDetector:
      type: object
      required: [categoryId]
      properties:
        categoryId: {type: string, pattern: "^CUSTOM(\\.[A-Z][A-Z0-9_]*)+$"}
        valuePattern: {type: string, maxLength: 512}
        namePattern: {type: string, maxLength: 512}
    ScanBudget:
      type: object
      properties:
        maxDurationSeconds: {type: integer, minimum: 1}
        maxRowsPerTable: {type: integer, format: int64, minimum: 1}
        maxBytesPerTable: {type: integer, format: int64, minimum: 1}
        maxConnections: {type: integer, minimum: 1}
        maxRowsPerSecond: {type: integer, minimum: 1}
    PolicyDraft:
      type: object
      required: [customDetectors]
      properties:
        customDetectors:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/CustomDetector"}
        scanBudget: {$ref: "#/components/schemas/ScanBudget"}
    Policy:
      allOf:
        - $ref: "#/components/schemas/PolicyDraft"
        - type: object
          required: [version]
          properties:
            version: {type: integer, format: int64}
    AuditEvent:
      type: object
      required: [id, time, type, sourceId, databasePrincipal, applicationPrincipal, applicationId, clientAddress, sessionId, transactionId, identityConfidence, operation, tables, columns, categories, queryFingerprint, executionStatus, errorCode, evidenceLevel, objectResolution, gapReason]
      properties:
        id: {type: string, format: uuid}
        time: {type: string, format: date-time}
        type: {type: string}
        sourceId: {type: string, format: uuid}
        databasePrincipal: {type: string}
        applicationPrincipal: {type: string}
        applicationId:
          description: The application that signed the context, empty without one.
          type: string
        clientAddress: {type: string}
        sessionId:
          description: The engine's session number; with the source it ties statements of one connection together.
          type: string
        transactionId: {type: string}
        identityConfidence: {type: string}
        operation: {type: string}
        tables:
          type: array
          items: {type: string}
        columns:
          type: array
          items: {type: string}
        categories:
          type: array
          items: {type: string}
        queryFingerprint: {type: string}
        executionStatus: {type: string}
        errorCode: {type: string}
        evidenceLevel: {type: string}
        objectResolution: {type: string}
        gapReason: {type: string}
        gapLostEvents: {type: integer, format: int64}
    AuditEventPage:
      type: object
      required: [total, totalExact, items]
      properties:
        total:
          type: integer
          format: int64
          description: Matches counted up to 10000. When totalExact is false there are more.
        totalExact: {type: boolean}
        items:
          type: array
          items: {$ref: "#/components/schemas/AuditEvent"}
    CoverageRow:
      type: object
      description: Shares are absent when nothing was measured; absent never means zero.
      required: [sourceId, sourceKey, engine, status, reason, readsAudited, statements, gaps, lostEvents]
      properties:
        sourceId: {type: string, format: uuid}
        sourceKey: {type: string}
        engine: {type: string}
        status: {type: string, enum: [OBSERVING, DEGRADED, BLIND, NOT_CONFIGURED]}
        reason: {type: string}
        readsAudited: {type: boolean}
        lastScanStatus: {type: string}
        lastScanAt: {type: string, format: date-time}
        lastEventAt: {type: string, format: date-time}
        positionReadAt: {type: string, format: date-time}
        statements: {type: integer, format: int64}
        gaps: {type: integer, format: int64}
        lostEvents: {type: integer, format: int64}
        columnsShare: {type: number, format: double}
        verifiedShare: {type: number, format: double}
        principalShare: {type: number, format: double}
    TimelinePoint:
      type: object
      required: [hour, events, sensitiveEvents, failedEvents]
      properties:
        hour: {type: string, format: date-time}
        events: {type: integer, format: int64}
        sensitiveEvents: {type: integer, format: int64}
        failedEvents: {type: integer, format: int64}
    SearchResult:
      type: object
      required: [sources, tables, columns, principals]
      properties:
        principals:
          type: array
          items: {$ref: "#/components/schemas/PrincipalHit"}
        sources:
          type: array
          items: {$ref: "#/components/schemas/SearchHit"}
        tables:
          type: array
          items: {$ref: "#/components/schemas/SearchHit"}
        columns:
          type: array
          items: {$ref: "#/components/schemas/SearchHit"}
    SearchHit:
      type: object
      required: [id, name, context]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        context:
          description: Where the object is, such as the source and schema of a table.
          type: string
        categories:
          type: array
          items: {type: string}
    AccessSummary:
      type: object
      required: [events, sensitiveEvents, failedEvents, principals, gaps]
      properties:
        events: {type: integer, format: int64}
        sensitiveEvents: {type: integer, format: int64}
        failedEvents: {type: integer, format: int64}
        principals: {type: integer, format: int64}
        gaps: {type: integer, format: int64}
    PrincipalAccess:
      type: object
      required: [databasePrincipal, applicationPrincipal, identityConfidence, events, sensitiveEvents, categories, sources, lastAccess]
      properties:
        databasePrincipal: {type: string}
        applicationPrincipal: {type: string}
        identityConfidence: {type: string}
        events: {type: integer, format: int64}
        sensitiveEvents: {type: integer, format: int64}
        categories:
          type: array
          items: {type: string}
        sources: {type: integer, format: int64}
        lastAccess: {type: string, format: date-time}
    CategoryAccess:
      type: object
      required: [category, events, principals, sources, lastAccess]
      properties:
        category: {type: string}
        events: {type: integer, format: int64}
        principals: {type: integer, format: int64}
        sources: {type: integer, format: int64}
        lastAccess: {type: string, format: date-time}
    CategoryInventory:
      type: object
      required: [category, columns, tables]
      properties:
        category: {type: string}
        columns: {type: integer, format: int64}
        tables: {type: integer, format: int64}
