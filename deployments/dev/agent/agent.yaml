# Agent of the local stand. Sources come from the center (ADR-0006); this file
# limits what the center may point the agent at.
center:
  url: https://server:8443
  ca_file: /etc/dataguard/ca/ca.crt
state_dir: /var/lib/dataguard
allowed:
  hosts: [source-postgres, source-mysql, source-mariadb, source-mssql]
  # The same host directories the databases write their audit logs to.
  audit_directories: [/var/log/dg-audit]
applications:
  - id: crm
    public_key_file: /etc/dataguard/apps/crm.pub
