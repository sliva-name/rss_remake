# Local stand. Every port binds to loopback in the 25xxx range and the project
# has its own network, so it cannot touch anything else running on the machine.
name: dataguard-dev

services:
  source-postgres:
    build: ./postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      - -c
      - logging_collector=on
      - -c
      - log_destination=jsonlog
      - -c
      - log_directory=/var/log/dg-audit
      - -c
      - log_filename=postgresql-%Y%m%d-%H%M%S.log
      - -c
      - log_rotation_size=10MB
      - -c
      - log_file_mode=0644
      - -c
      - pgaudit.log=read,write,ddl,role,misc_set
      - -c
      - pgaudit.log_parameter=off
      - -c
      - pgaudit.log_relation=off
      - -c
      - pgaudit.log_statement_once=off
      - -c
      - pgaudit.log_catalog=off
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: dg_admin
      POSTGRES_PASSWORD: ${SOURCE_ADMIN_PASSWORD}
      SOURCE_SCANNER_PASSWORD: ${SOURCE_SCANNER_PASSWORD}
      SOURCE_APP_PASSWORD: ${SOURCE_APP_PASSWORD}
    ports: ["127.0.0.1:25432:5432"]
    volumes:
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - source-postgres-data:/var/lib/postgresql/data
      # Bind mounts stand in for an agent installed on the database host.
      - ./.state/audit/postgres:/var/log/dg-audit
    healthcheck:
      # Over TCP: the init server of the image listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dg_admin -d crm"]
      interval: 3s
      timeout: 3s
      retries: 30

  source-mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: crm
      MYSQL_ROOT_PASSWORD: ${SOURCE_ADMIN_PASSWORD}
      SOURCE_SCANNER_PASSWORD: ${SOURCE_SCANNER_PASSWORD}
      SOURCE_APP_PASSWORD: ${SOURCE_APP_PASSWORD}
      DG_CLIENT: mysql
      UMASK: "0644"
    ports: ["127.0.0.1:25306:3306"]
    volumes:
      - ./mysql/audit.cnf:/etc/mysql/conf.d/dg-audit.cnf:ro
      - ./mysql/init.sql.tmpl:/dg/init.sql.tmpl:ro
      - ./mysql/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - source-mysql-data:/var/lib/mysql
      - ./.state/audit/mysql:/var/log/dg-audit
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 3s
      timeout: 3s
      retries: 40

  source-mariadb:
    build: ./mariadb
    environment:
      MARIADB_DATABASE: crm
      MYSQL_ROOT_PASSWORD: ${SOURCE_ADMIN_PASSWORD}
      SOURCE_SCANNER_PASSWORD: ${SOURCE_SCANNER_PASSWORD}
      SOURCE_APP_PASSWORD: ${SOURCE_APP_PASSWORD}
      DG_CLIENT: mariadb
      UMASK: "0644"
    ports: ["127.0.0.1:25307:3306"]
    volumes:
      - ./mariadb/audit.cnf:/etc/mysql/conf.d/dg-audit.cnf:ro
      - ./mysql/init.sql.tmpl:/dg/init.sql.tmpl:ro
      - ./mysql/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - source-mariadb-data:/var/lib/mysql
      - ./.state/audit/mariadb:/var/log/dg-audit
    healthcheck:
      # server_audit fails with only a log warning, so health must assert it is on.
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized && test \"$$(mariadb -uroot -p$$MYSQL_ROOT_PASSWORD -Ne \"show variables like 'server_audit_logging'\" | cut -f2)\" = ON"]
      interval: 3s
      timeout: 3s
      retries: 40

  source-mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    entrypoint: ["/dg/start.sh"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SOURCE_MSSQL_SA_PASSWORD}
      SCANNER_PASSWORD: ${SOURCE_MSSQL_SCANNER_PASSWORD}
      APP_PASSWORD: ${SOURCE_MSSQL_APP_PASSWORD}
    ports: ["127.0.0.1:25433:1433"]
    volumes:
      - ./mssql/start.sh:/dg/start.sh:ro
      - ./mssql/init.sql:/dg/init.sql:ro
      - source-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/dg-initialized && /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40

  center-postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: dataguard
      POSTGRES_USER: dg_owner
      POSTGRES_PASSWORD: ${CENTER_PG_ADMIN_PASSWORD}
      CENTER_PG_APP_PASSWORD: ${CENTER_PG_APP_PASSWORD}
    ports: ["127.0.0.1:25442:5432"]
    volumes:
      - ./center/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - center-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the init server of the image listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dg_owner -d dataguard"]
      interval: 3s
      timeout: 3s
      retries: 30

  center-clickhouse:
    image: clickhouse/clickhouse-server:25.8.2.29-alpine
    environment:
      CLICKHOUSE_DB: dataguard
      CLICKHOUSE_USER: dg_ch_admin
      CLICKHOUSE_PASSWORD: ${CENTER_CH_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CENTER_CH_APP_PASSWORD: ${CENTER_CH_APP_PASSWORD}
    ports:
      - "127.0.0.1:25123:8123"
      - "127.0.0.1:25900:9000"
    volumes:
      - ./center/clickhouse-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - center-clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: 262144
    healthcheck:
      # On the container's own address: the init server of the image listens on
      # 127.0.0.1 only, and other containers cannot reach it yet.
      test: ["CMD-SHELL", "wget -q --spider http://$$(hostname):8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Event broker between ingest and ClickHouse (ADR-0009). One node on the stand;
  # an installation needs three.
  center-redpanda:
    image: redpandadata/redpanda:v26.2.5@sha256:badca2d958f81da675c3055a9ecb6ebb590325582bcf16936148ffd65e96e920
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://center-redpanda:9092,external://127.0.0.1:25092
    environment:
      RP_BOOTSTRAP_USER: dg_broker_admin:${CENTER_BROKER_ADMIN_PASSWORD}:SCRAM-SHA-256
    ports:
      - "127.0.0.1:25092:19092"
    volumes:
      - ./redpanda/bootstrap.yaml:/etc/redpanda/.bootstrap.yaml:ro
      - center-redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      timeout: 5s
      retries: 40

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    # The browser reaches Keycloak through the published port and the server through
    # the network, so the issuer is fixed and back-channel addresses follow the request.
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --health-enabled=true
      - --hostname=http://127.0.0.1:25080
      - --hostname-backchannel-dynamic=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: dg_admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports: ["127.0.0.1:25080:8080"]
    volumes:
      - ./keycloak/dataguard-realm.json:/opt/keycloak/data/import/dataguard-realm.json:ro
      - ../keycloak/themes/dataguard:/opt/keycloak/themes/dataguard:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 40

  # The platform. Images come from the Dockerfile at the repository root.
  pki-init:
    build: {context: ../.., target: server}
    image: dataguard/server:dev
    command: ["pki-init", "--dir", "/var/lib/dataguard/pki", "--hosts", "server,127.0.0.1,localhost",
              "--keep-existing", "--public-dir", "/var/lib/dataguard/ca"]
    volumes:
      - center-pki:/var/lib/dataguard/pki
      - center-ca:/var/lib/dataguard/ca
    restart: "no"

  migrate:
    image: dataguard/server:dev
    depends_on:
      pki-init:
        condition: service_completed_successfully
      center-postgres:
        condition: service_healthy
      center-clickhouse:
        condition: service_healthy
      center-redpanda:
        condition: service_healthy
    command: ["migrate"]
    environment:
      DG_PG_MIGRATION_DSN: postgres://dg_owner:${CENTER_PG_ADMIN_PASSWORD}@center-postgres:5432/dataguard?sslmode=disable
      DG_CH_ADDR: center-clickhouse:9000
      DG_CH_DATABASE: dataguard
      DG_CH_USER: dg_ch_app
      DG_CH_MIGRATION_USER: dg_ch_admin
      DG_CH_MIGRATION_PASSWORD: ${CENTER_CH_ADMIN_PASSWORD}
      DG_BROKERS: center-redpanda:9092
      DG_BROKER_USER: dg_broker_app
      DG_BROKER_PASSWORD: ${CENTER_BROKER_APP_PASSWORD}
      DG_BROKER_ADMIN_USER: dg_broker_admin
      DG_BROKER_ADMIN_PASSWORD: ${CENTER_BROKER_ADMIN_PASSWORD}
      # One copy suits a single-node stand only; an installation uses 3.
      DG_BROKER_REPLICATION: "1"
    restart: "no"

  server:
    image: dataguard/server:dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      DG_PG_DSN: postgres://dg_runtime:${CENTER_PG_APP_PASSWORD}@center-postgres:5432/dataguard?sslmode=disable
      DG_CH_ADDR: center-clickhouse:9000
      DG_CH_DATABASE: dataguard
      DG_CH_USER: dg_ch_app
      DG_CH_PASSWORD: ${CENTER_CH_APP_PASSWORD}
      DG_OIDC_ISSUER: http://127.0.0.1:25080/realms/dataguard
      DG_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/dataguard
      DG_OIDC_CLIENT_ID: dataguard-dashboard
      DG_METRICS_ADDR: ":9100"
      DG_BROKERS: center-redpanda:9092
      DG_BROKER_USER: dg_broker_app
      DG_BROKER_PASSWORD: ${CENTER_BROKER_APP_PASSWORD}
    ports:
      - "127.0.0.1:25800:8080"
      - "127.0.0.1:25443:8443"
      - "127.0.0.1:25910:9100"
    volumes:
      # The CA key stays in this volume; agents only get the certificate.
      - center-pki:/var/lib/dataguard/pki:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/dataguard-server", "ready"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Started after enrollment: make agent-enroll TOKEN_FILE=..., then make agent-up.
  agent:
    profiles: [agent]
    build: {context: ../.., target: agent}
    image: dataguard/agent:dev
    depends_on:
      server:
        condition: service_healthy
      source-postgres:
        condition: service_healthy
      source-mysql:
        condition: service_healthy
      source-mariadb:
        condition: service_healthy
      source-mssql:
        condition: service_healthy
    volumes:
      - ./agent/agent.yaml:/etc/dataguard/agent.yaml:ro
      - ./.state/apps/crm.pub:/etc/dataguard/apps/crm.pub:ro
      - center-ca:/etc/dataguard/ca:ro
      - agent-state:/var/lib/dataguard
      # The same directories the databases write their audit logs to.
      - ./.state/audit/postgres:/var/log/dg-audit/postgres:ro
      - ./.state/audit/mysql:/var/log/dg-audit/mysql:ro
      - ./.state/audit/mariadb:/var/log/dg-audit/mariadb:ro
    ports:
      - "127.0.0.1:25964:9464"
    restart: unless-stopped

  # The dashboard walk in a real browser. It uses the host network to open the
  # platform at the same addresses as a user, which OIDC redirects require.
  browser-check:
    profiles: [check]
    build: ../../web/dashboard/e2e
    image: dataguard/browser-check:dev
    network_mode: host
    # The account comes from the caller: docker compose run -e DG_UI_USER -e DG_UI_PASSWORD.
    environment:
      DG_UI_URL: http://127.0.0.1:25800
    volumes:
      - ./.state/browser:/out
    restart: "no"

volumes:
  center-pki:
  center-ca:
  agent-state:
  source-postgres-data:
  source-mysql-data:
  source-mariadb-data:
  source-mssql-data:
  center-postgres-data:
  center-clickhouse-data:
  center-redpanda-data:
