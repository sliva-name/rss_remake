# The login pages in the dashboard's look. Templates come from the base theme;
# only the page layout (template.ftl) and the styles are DataGuard's own.
parent=base
import=common/keycloak
locales=ru

styles=css/login.css
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=dg
kcBodyClass=dg-body
kcLoginClass=dg-page
kcFormCardClass=dg-card

kcFormClass=dg-form
kcFormGroupClass=dg-field
kcLabelWrapperClass=dg-label-wrap
kcLabelClass=dg-label
kcInputWrapperClass=dg-input-wrap
kcInputClass=dg-input
kcTextareaClass=dg-input
kcInputGroup=dg-input-group
kcInputErrorMessageClass=dg-field-error
kcContentWrapperClass=dg-row
kcFormSettingClass=dg-options
kcFormOptionsClass=dg-options
kcFormOptionsWrapperClass=dg-options-links
kcFormButtonsClass=dg-buttons
kcFormButtonsWrapperClass=dg-buttons
kcMarginTopClass=dg-gap

kcButtonClass=dg-button
kcButtonPrimaryClass=dg-primary
kcButtonDefaultClass=dg-secondary
kcButtonBlockClass=dg-block
kcButtonLargeClass=

kcAlertClass=dg-alert
kcAlertTitleClass=dg-alert-text
kcSignUpClass=dg-info

kcFormPasswordVisibilityButtonClass=dg-reveal
kcFormPasswordVisibilityIconShow=dg-icon dg-icon-eye
