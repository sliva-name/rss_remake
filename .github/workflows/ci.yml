# Checks of every change. The stand job runs the same containers as make dev-up,
# so integration and end-to-end tests here are the ones run locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The exact Go from go.mod, never a toolchain downloaded on the fly.
  GOTOOLCHAIN: local

jobs:
  check:
    name: Lint, unit tests, vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make check
      - name: Generated code matches the contracts
        run: |
          make proto api
          git diff --exit-code -- internal/gen

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Types match the API contract
        run: |
          npm run api
          git diff --exit-code -- src/schema.d.ts
      - run: npm run build
      - run: npm test

  stand:
    name: Integration and end-to-end on the stand
    needs: [check, dashboard]
    # The stand is the costly part; branches get it through their pull request.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Free disk space for the stand images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Start the stand
        run: make dev-up
      - name: Integration tests
        run: make test-integration
      - name: End-to-end tests
        run: make test-e2e
      # Only the platform's own containers: their logs go through safelog. Database
      # and Keycloak logs are left out, they may echo the stand's passwords.
      - name: Platform logs
        if: failure()
        run: >-
          docker compose --project-name dataguard-dev --env-file deployments/dev/.env -f deployments/dev/compose.yml
          --profile agent logs --no-color --timestamps pki-init migrate server agent > stand.log
      - name: Keep logs and browser screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stand
          path: |
            stand.log
            deployments/dev/.state/browser
          retention-days: 7
