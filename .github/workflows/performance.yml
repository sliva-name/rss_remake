# Load tests with the thresholds of ROADMAP.md, stage 0. A hosted runner has less
# disk than the reference volume of 100 million events needs, so it seeds fewer
# by default; the reference run is done on the stand machine.
name: Performance

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      events:
        description: Synthetic events to seed for the report tests
        default: "20000000"

permissions:
  contents: read

concurrency:
  group: performance
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  performance:
    name: Reports, search, ingest and scan load
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Free disk space for the stand and the seeded events
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Start the stand
        run: make dev-up
      - name: Load tests
        env:
          DG_PERF_EVENTS: ${{ inputs.events || '20000000' }}
        run: go test -tags=performance -count=1 -v -timeout 45m ./tests/performance/
