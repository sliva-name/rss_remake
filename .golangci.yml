version: "2"
linters:
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - unused
  settings:
    depguard:
      rules:
        core-is-infrastructure-free:
          files: ["**/internal/core/**"]
          deny:
            - pkg: dataguard/internal/connector
              desc: core depends on interfaces, not on database adapters
            - pkg: dataguard/internal/server
              desc: core must not know its transport or storage
            - pkg: dataguard/internal/agent
              desc: core must not know the agent runtime
        connectors-are-independent:
          files: ["**/internal/connector/**"]
          deny:
            - pkg: dataguard/internal/server
              desc: adapters run on the agent and must not reach central code
    forbidigo:
      forbid:
        # All agent and server output goes through safelog so it can be filtered.
        - pattern: ^(fmt\.Print.*|print|println)$
        - pattern: ^log\.(Print|Fatal|Panic).*$
    gosec:
      excludes:
        # G115 flags every integer conversion; bounds are checked where they matter.
        - G115
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    paths:
      - internal/gen
    rules:
      - path: _test\.go
        linters: [gosec, forbidigo, unparam]
      - path: ^(cmd|scripts)/
        linters: [forbidigo]
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/gen
